name: deploy rest-api

on:
  workflow_run: 
    workflows: [ "CI build and push" ]
    types:
      - completed 
    branches: [ "main" ]

jobs:
  doploy-to-server:
    runs-on:
      - ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: deploy via container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/rest-api:latest
            docker run -d --restart always -p 80:8080 --name spring-app ${{ secrets.DOCKER_HUB_USERNAME }}/rest-api:latest
        
