name : CI build and push

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup jdk env:
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: run unit test
        run: mvn -B test

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username:
          password:
          
